<style>
:root{
  --bg:#14102b; --card:#1f1a3d; --card2:#2a2452; --text:#f4f1ff; --muted:#a79fd1;
  --accent:#ff4fa3; --accent2:#5ef2c8; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.muted{color:var(--muted)}

/* Cabecera */
header{position:sticky;top:0;z-index:5;background:linear-gradient(#14102b,#14102bee);padding:max(14px,env(safe-area-inset-top)) 16px 10px;backdrop-filter:blur(6px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);font-size:1.2rem;display:grid;place-items:center;flex:none}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.logo i{background:var(--accent);border-radius:2px}
.logo i:nth-child(2),.logo i:nth-child(4),.logo i:nth-child(6),.logo i:nth-child(8){background:var(--accent2)}
.logo i:nth-child(5){background:#fff}
h1{font-size:1.5rem;letter-spacing:.5px}
h1 span{color:var(--accent)}
.search{width:100%;padding:12px 14px;border-radius:var(--radius);border:2px solid transparent;background:var(--card);color:var(--text);font-size:1rem;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--muted);font-size:.9rem}
.chip.on{background:var(--accent);color:#fff;font-weight:600}

/* Catálogo */
main{padding:8px 16px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.game{background:var(--card);border-radius:var(--radius);overflow:hidden;text-align:left;transition:transform .12s;display:flex;flex-direction:column}
.game:active{transform:scale(.97)}
.thumb{aspect-ratio:4/3;background:var(--card2);display:grid;place-items:center;font-size:2.4rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:10px 12px 12px}
.info b{display:block;font-size:1rem;margin-bottom:2px}
.info small{color:var(--muted)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);line-height:1.5}
.empty .big{font-size:3rem;margin-bottom:10px}
.empty code{background:var(--card);padding:2px 6px;border-radius:6px;color:var(--accent2)}
.foot{text-align:center;padding:34px 0 10px}
.link{color:var(--muted);text-decoration:underline;font-size:.95rem;padding:8px}

/* Menú lateral */
#scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--bg);border-right:1px solid var(--card2);transform:translateX(-100%);transition:transform .22s;z-index:41;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 0 max(14px,env(safe-area-inset-bottom))}
#drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px}
.dhead b{font-size:1.3rem}.dhead b span{color:var(--accent)}
.dtitle{padding:6px 16px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
#dlist{flex:1;overflow-y:auto;padding:4px 8px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 10px;border-radius:12px}
.ditem:active{background:var(--card)}
.ditem .e{font-size:1.4rem}
.ditem b{display:block;font-size:.98rem}
.ditem small{color:var(--muted)}
.dempty{padding:12px 10px;color:var(--muted)}
.devbtn{margin:10px 16px 0;padding:14px;border-radius:12px;background:var(--card2);font-weight:600;border:2px solid var(--accent)}

/* Visor */
#viewer{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20}
#viewer.open{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:var(--bg)}
.bar .title{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:8px 14px;border-radius:10px;background:var(--card2)}
.btn.primary{background:var(--accent);color:#fff}
.btn.big{padding:13px 16px;font-weight:600}
.btn.wide{flex:1}
.btn:disabled{opacity:.5}
#frame{flex:1;width:100%;border:0;background:#fff}

/* Zona de desarrolladores */
#dev{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:30}
#dev.open{display:flex}
#devBody{flex:1;overflow-y:auto;padding:18px 16px 40px;width:100%;max-width:560px;margin:0 auto}
#devBody h2{margin-bottom:6px}
#devBody h3{margin:22px 0 10px;font-size:1.05rem}
#devBody p{line-height:1.5;margin-bottom:12px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:2px solid transparent;background:var(--card);color:var(--text);font:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:4px}
.msg{min-height:1.2em;margin-top:10px;font-size:.92rem}
.msg.ok{color:var(--accent2)}.msg.err{color:#ff8fa8}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;line-height:1.5}
.mine{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:8px}
.mine .t{flex:1;min-width:0}
.mine b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mine small{color:var(--muted)}
.tag{font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--card2)}
.tag.approved{background:#1d5c47;color:#c8fff0}.tag.pending{background:#5c4a1d;color:#ffe9b0}.tag.rejected{background:#5c1d2b;color:#ffc9d4}
.del{padding:6px 10px;border-radius:10px;background:var(--card2);color:#ff8fa8}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.who small{color:var(--muted);word-break:break-all}
</style>
</head>

  <div class="top">
    <button class="iconbtn" id="menuBtn" aria-label="Abrir menú">☰</button>
    <div class="brand">
      <div class="logo"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<main>

</aside>

    <button class="btn" id="back">← Volver</button>
    <div class="title" id="vtitle"></div>
    <button class="btn" id="reload" title="Reiniciar">↻</button>

  </div>

    allow="fullscreen; gamepad; autoplay"></iframe>
</div>

  </div>
  <div id="devBody"></div>
</div>

<script>
// Zona de desarrolladores de Pixelia: cuentas, subida y lectura de juegos (Supabase).
// Si config.js está vacío, la app funciona igual y esta zona avisa que falta conectar el servidor.
(function(){
  const cfg = window.PIXELIA_CONFIG || {};
  const enabled = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
  const CATS = ["Acción","Aventura","Arcade","Carreras","Deportes","Plataformas","Puzzle","Otros"];
  const MAX = 5 * 1024 * 1024; // 5 MB
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const STATUS = { approved:"Publicado", pending:"En revisión", rejected:"Rechazado" };

  let client = null, loading = null;

  function getClient(){
    if(!enabled) return Promise.reject(new Error("off"));
    if(client) return Promise.resolve(client);
    if(loading) return loading;
    loading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = () => { client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); resolve(client); };
      s.onerror = () => { loading = null; reject(new Error("lib")); };
      document.head.appendChild(s);
    });
    return loading;
  }

  function tr(m){
    m = String(m || "");
    if(/Invalid login/i.test(m)) return "Correo o contraseña incorrectos.";
    if(/already registered/i.test(m)) return "Ese correo ya tiene cuenta. Prueba entrar.";
    if(/Password should be/i.test(m)) return "La contraseña debe tener al menos 6 caracteres.";
    if(/not confirmed/i.test(m)) return "Confirma tu correo antes de entrar (revisa tu bandeja).";
    if(/row-level security|violates/i.test(m)) return "Tu cuenta aún no tiene permiso para publicar.";
    if(/Failed to fetch|NetworkError/i.test(m)) return "Sin conexión. Revisa tu internet.";
    return m || "Ocurrió un error. Intenta de nuevo.";
  }
  const say = (el, text, ok) => { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); };

  /* ---------- Catálogo en la nube ---------- */
  async function loadApproved(){
    try{
      const c = await getClient();
      const { data, error } = await c.from("games")
        .select("id,title,category,description,file_path")
        .eq("status", "approved").order("created_at", { ascending:false });
      if(error || !data) return [];
      return data.map(g => ({ id:"c_" + g.id, title:g.title, category:g.category, description:g.description, source:"cloud", file_path:g.file_path }));
    }catch(e){ return []; }
  }

  async function getHtml(path){
    const c = await getClient();
    const { data } = c.storage.from("games").getPublicUrl(path);
    const r = await fetch(data.publicUrl);
    if(!r.ok) throw new Error("fetch");
    return r.text();
  }

  /* ---------- Panel ---------- */
  function open(){
    $("dev").classList.add("open");
    history.pushState({ dev:1 }, "");
    render();
  }
  function close(){ $("dev").classList.remove("open"); }

  async function render(flash){
    const body = $("devBody");
    if(!enabled){
      body.innerHTML = `<h2>Zona de desarrolladores</h2>
        <div class="card">Esta función aún no está activada. Falta conectar el servidor de cuentas (ver <b>SERVIDOR.md</b>).</div>`;
      return;
    }
    body.innerHTML = `<p class="muted">Cargando…</p>`;
    try{
      const c = await getClient();
      const { data } = await c.auth.getSession();
      if(data && data.session) await renderDash(c, data.session.user, flash);
      else renderLogin(c);
    }catch(e){
      body.innerHTML = `<h2>Zona de desarrolladores</h2><div class="card">No se pudo conectar. Revisa tu internet e inténtalo de nuevo.</div>`;
    }
  }

  function renderLogin(c){
    $("devBody").innerHTML = `
      <h2>Zona de desarrolladores</h2>
      <p class="muted">Entra o crea tu cuenta para publicar tus juegos en Pixelia.</p>
      <form id="authForm">
        <label class="field"><span>Correo</span><input id="aEmail" type="email" required autocomplete="email"></label>
        <label class="field"><span>Contraseña</span><input id="aPass" type="password" required minlength="6" autocomplete="current-password"></label>
        <div class="row">
          <button class="btn primary big wide" type="submit" id="aIn">Entrar</button>
          <button class="btn big wide" type="button" id="aUp">Crear cuenta</button>
        </div>
        <p id="aMsg" class="msg"></p>
      </form>`;
    const msg = $("aMsg");
    const creds = () => ({ email: $("aEmail").value.trim(), password: $("aPass").value });
    $("authForm").addEventListener("submit", async e => {
      e.preventDefault();
      say(msg, "Entrando…", true);
      const { error } = await c.auth.signInWithPassword(creds());
      if(error) say(msg, tr(error.message)); else render();
    });
    $("aUp").addEventListener("click", async () => {
      if(!$("authForm").reportValidity()) return;
      say(msg, "Creando cuenta…", true);
      const { data, error } = await c.auth.signUp(creds());
      if(error) return say(msg, tr(error.message));
      if(data.session) render();
      else say(msg, "Cuenta creada. Revisa tu correo para confirmarla y luego entra.", true);
    });
  }

  async function renderDash(c, user, flash){
    const [prof, mine] = await Promise.all([
      c.from("profiles").select("can_publish").eq("id", user.id).maybeSingle(),
      c.from("games").select("id,title,category,status,file_path").eq("owner", user.id).order("created_at", { ascending:false })
    ]);
    const canPublish = !!(prof.data && prof.data.can_publish);
    const list = mine.data || [];
    const contact = cfg.CONTACT ? ` Contacto: <b>${esc(cfg.CONTACT)}</b>.` : "";

    const upload = canPublish ? `
      <h3>Subir un juego</h3>
      <form id="upForm">
        <label class="field"><span>Título</span><input id="uTitle" required minlength="2" maxlength="60"></label>
        <label class="field"><span>Categoría</span><select id="uCat">${CATS.map(x=>`<option>${x}</option>`).join("")}</select></label>
        <label class="field"><span>Descripción (opcional)</span><textarea id="uDesc" rows="2" maxlength="200"></textarea></label>
        <label class="field"><span>Archivo del juego (.html, máx. 5 MB)</span><input id="uFile" type="file" accept=".html,text/html" required></label>
        <p class="muted" style="font-size:.85rem">Debe ser un solo archivo .html con todo incluido (estilos, scripts e imágenes dentro). Si guardas datos con localStorage, usa try/catch.</p>
        <button class="btn primary big" style="width:100%" type="submit" id="uBtn">Enviar para revisión</button>
        <p id="uMsg" class="msg"></p>
      </form>`
      : `<div class="card">Tu cuenta aún no está habilitada para publicar. Cuando se active podrás subir tus juegos aquí.${contact}</div>`;

    $("devBody").innerHTML = `
      <div class="who"><div><b>Tu cuenta</b><br><small>${esc(user.email)}</small></div><button class="btn" id="outBtn">Salir</button></div>
      ${flash ? `<p class="msg ok">${esc(flash)}</p>` : ""}
      ${upload}
      <h3>Mis juegos</h3>
      ${list.length ? list.map(g=>`
        <div class="mine"><div class="t"><b>${esc(g.title)}</b><small>${esc(g.category)}</small></div>
        <span class="tag ${esc(g.status)}">${esc(STATUS[g.status] || g.status)}</span>
        <button class="del" data-id="${esc(g.id)}" data-path="${esc(g.file_path)}" aria-label="Borrar">🗑️</button></div>`).join("")
        : `<p class="muted">Aún no has subido juegos.</p>`}`;

    $("outBtn").onclick = async () => { await c.auth.signOut(); render(); };

    $("devBody").querySelectorAll(".del").forEach(b => b.addEventListener("click", async () => {
      if(!confirm("¿Borrar este juego?")) return;
      const del = await c.from("games").delete().eq("id", b.dataset.id);
      if(!del.error) await c.storage.from("games").remove([b.dataset.path]);
      render(del.error ? tr(del.error.message) : "Juego borrado.");
    }));

    const form = $("upForm");
    if(form) form.addEventListener("submit", async e => {
      e.preventDefault();
      const msg = $("uMsg"), btn = $("uBtn"), f = $("uFile").files[0];
      if(!f) return say(msg, "Elige un archivo .html.");
      if(!/\.html?$/i.test(f.name)) return say(msg, "El archivo debe ser .html");
      if(f.size > MAX) return say(msg, "El archivo pesa más de 5 MB.");
      btn.disabled = true; say(msg, "Subiendo…", true);
      const path = user.id + "/" + crypto.randomUUID() + ".html";
      try{
        const up = await c.storage.from("games").upload(path, f, { contentType:"text/html", upsert:false });
        if(up.error) throw up.error;
        const ins = await c.from("games").insert({
          title: $("uTitle").value.trim(), category: $("uCat").value,
          description: $("uDesc").value.trim(), file_path: path
        });
        if(ins.error){ await c.storage.from("games").remove([path]); throw ins.error; }
        render("¡Enviado! Se publicará cuando lo aprobemos.");
      }catch(err){
        say(msg, tr(err && err.message)); btn.disabled = false;
      }
    });

    $("devBack").onclick = () => (history.state && history.state.dev) ? history.back() : close();
  }

  document.addEventListener("DOMContentLoaded", () => {
    $("devBack").onclick = () => (history.state && history.state.dev) ? history.back() : close();
  });

  window.PixeliaDev = { open, close, loadApproved, getHtml };
})();

</script>
<script>
const $ = id => document.getElementById(id);
const SB_OWN   = "allow-scripts allow-same-origin allow-pointer-lock allow-popups";
const SB_CLOUD = "allow-scripts allow-pointer-lock allow-popups"; // juegos de terceros: aislados
let games = [], cat = "Todos", term = "", current = null;

/* ---------- Cargar catálogo ---------- */
async function load(){
  let own = window.PIXELIA_GAMES || [];
  if(!own.length) try{
    const r = await fetch("games.json", {cache:"no-cache"});
    const data = await r.json();
    own = Array.isArray(data) ? data : (data.games || []);
  }catch(e){}
  games = own.map(g => ({...g, source:"own"}));
  render();
  if(window.PixeliaDev){
    const extra = await PixeliaDev.loadApproved();
    if(extra.length){ games = games.concat(extra); render(); }
  }
}

/* ---------- Pintar ---------- */
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(){
  const cats = ["Todos", ...new Set(games.map(g=>g.category).filter(Boolean))];
  $("chips").innerHTML = cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");

  const list = games.filter(g =>
    (cat==="Todos" || g.category===cat) &&
    (g.title+" "+(g.description||"")+" "+(g.category||"")).toLowerCase().includes(term)
  );

  $("grid").innerHTML = list.map(g=>`
    <button class="game" data-id="${esc(g.id)}">
      <div class="thumb">${g.thumb ? `<img loading="lazy" src="${esc(g.thumb)}" alt="">` : "🎮"}</div>
      <div class="info"><b>${esc(g.title)}</b><small>${esc(g.category||"Juego")}</small></div>
    </button>`).join("");

  // Menú lateral con todos los juegos
  $("dlist").innerHTML = games.length
    ? games.map(g=>`<button class="ditem" data-id="${esc(g.id)}"><span class="e">🎮</span><span><b>${esc(g.title)}</b><small>${esc(g.category||"Juego")}</small></span></button>`).join("")
    : `<p class="dempty">Aún no hay juegos</p>`;

  const empty = $("empty");
  if(!games.length){
    empty.hidden = false;
    empty.innerHTML = `<div class="big">👾</div><b>Aún no hay juegos</b><br>
      Agrega tus juegos como archivos <code>juego-nombre.html</code> y regístralos en <code>games.json</code>.`;
  }else if(!list.length){
    empty.hidden = false;
    empty.innerHTML = `<div class="big">🔍</div>No encontramos juegos con esa búsqueda.`;
  }else empty.hidden = true;
}

$("chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  cat = b.dataset.c; render();
});
$("q").addEventListener("input", e=>{ term = e.target.value.trim().toLowerCase(); render(); });
$("grid").addEventListener("click", e=>{
  const b = e.target.closest(".game"); if(!b) return;
  openGame(games.find(g=>g.id===b.dataset.id));
});

/* ---------- Menú lateral ---------- */
function openDrawer(){ $("drawer").classList.add("on"); $("scrim").classList.add("on"); $("drawer").setAttribute("aria-hidden","false"); }
function closeDrawer(){ $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); $("drawer").setAttribute("aria-hidden","true"); }
$("menuBtn").onclick = openDrawer;
$("dclose").onclick = closeDrawer;
$("scrim").onclick = closeDrawer;
$("dlist").addEventListener("click", e=>{
  const b = e.target.closest(".ditem"); if(!b) return;
  closeDrawer();
  openGame(games.find(g=>g.id===b.dataset.id));
});
function openDev(){ closeDrawer(); window.PixeliaDev && PixeliaDev.open(); }
$("devBtn").onclick = openDev;
$("devBtn2").onclick = openDev;

/* ---------- Visor ---------- */
async function openGame(g){
  if(!g) return;
  current = g;
  const f = $("frame");
  f.removeAttribute("srcdoc");
  $("vtitle").textContent = g.title;
  $("viewer").classList.add("open");
  history.pushState({play:g.id}, "");
  if(g.source === "cloud"){
    f.setAttribute("sandbox", SB_CLOUD);
    let html;
    try{ html = await PixeliaDev.getHtml(g.file_path); }
    catch(e){ html = "<body style='font-family:sans-serif;padding:20px'>No se pudo cargar el juego.</body>"; }
    if(current === g) f.srcdoc = html;
  }else{
    f.setAttribute("sandbox", SB_OWN);
    if(window.PIXELIA_OWN && PIXELIA_OWN[g.id]) f.srcdoc = PIXELIA_OWN[g.id](); else f.src = g.path || ("juego-" + g.id + ".html");
  }
}
function closeGame(){
  $("viewer").classList.remove("open");
  const f = $("frame");
  f.removeAttribute("srcdoc");
  f.src = "about:blank";
  current = null;
}
$("back").onclick = () => history.state && history.state.play ? history.back() : closeGame();
window.addEventListener("popstate", () => { closeGame(); window.PixeliaDev && PixeliaDev.close(); });
$("reload").onclick = () => {
  if(!current) return;
  const f = $("frame");
  if(f.hasAttribute("srcdoc")){ const h = f.srcdoc; f.srcdoc = ""; setTimeout(()=>{ f.srcdoc = h; }, 50); }
  else f.src = f.src;
};
$("full").onclick = () => {
  const el = $("frame");
  (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
};

/* ---------- PWA ---------- */
if("serviceWorker" in navigator){
  addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

load();
</script>
</body>
</html>
